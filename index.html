#fd2 .l3 h2{margin:3px 0 0;font-size:clamp(17px,2.8vw,26px);line-height:1.1;text-shadow:0 2px 12px #000}
#fd2 .rec{position:absolute;right:16px;top:28px;z-index:9;font:700 10px ui-monospace,monospace;color:#fecaca;letter-spacing:.12em}
#fd2 .rec i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ef4444;margin-right:6px;animation:fdbl 1s steps(2) infinite}
@keyframes fdbl{50%{opacity:.15}}
#fd2 .dw{position:absolute;left:0;bottom:14px;height:3px;width:0;background:#fbbf24;z-index:9;box-shadow:0 0 8px #fbbf24}
#fd2 .dw.run{animation:fddw var(--dwell) linear forwards}
@keyframes fddw{to{width:100%}}
#fd2 .tl{display:flex;gap:2px;padding:12px 10px;background:#081025;border-top:1px solid var(--line)}
#fd2 .tb{flex:1;min-width:0;background:none;border:0;color:var(--mut);cursor:pointer;padding:4px 2px;font-size:10.5px;text-align:center;border-radius:8px}
#fd2 .tb .d{display:grid;place-items:center;margin:0 auto 5px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(125,211,252,.35);font-weight:800;font-size:11px;background:#0b1530;color:#cbd5e1;transition:all .4s}
#fd2 .tb.done .d{background:#0e7490;border-color:#38bdf8;color:#fff}
#fd2 .tb.act .d{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);border-color:#fff;color:#fff;box-shadow:0 0 14px #38bdf8;transform:scale(1.15)}
#fd2 .tb.act{color:var(--ink);font-weight:700}
#fd2 .lbl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fd2 .inf{padding:16px 18px 20px;background:#071022;transition:opacity .35s}
#fd2 .inf.fade{opacity:.15}
#fd2 .inf .k{font-size:10.5px;font-weight:800;color:#7dd3fc;letter-spacing:.14em}
#fd2 .inf h3{margin:4px 0 0;font-size:18px}
#fd2 .sum{color:var(--mut);font-size:13px;line-height:1.55;margin:6px 0 14px}
#fd2 .cols{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
#fd2 .col{background:rgba(15,25,50,.7);border:1px solid rgba(125,211,252,.15);border-radius:12px;padding:12px}
#fd2 .col h4{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8}
#fd2 .col ol{margin:0;padding-left:18px;font-size:12.5px;line-height:1.55}
#fd2 .chips{display:flex;flex-wrap:wrap;gap:6px}
#fd2 .chip{font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid rgba(125,211,252,.35);background:rgba(14,116,144,.18)}
#fd2 .tip{font-size:12.5px;line-height:1.5}
@media(max-width:760px){#fd2 .cols{grid-template-columns:1fr}#fd2 .vp{height:400px}#fd2 .set{transform:translateX(-50%) scale(.78)}#fd2 .agent{transform:scale(1.15)}}
@media(max-width:520px){#fd2 .lbl{display:none}#fd2 .l3{max-width:72%}#fd2 .hdr h1{font-size:14px}}
@media(prefers-color-scheme:light){#fd2{--ink:#0f172a;--mut:#475569;background:#f8fafc}#fd2 .hdr{background:linear-gradient(90deg,#e0f2fe,#ede9fe)}#fd2 .b{background:#fff}#fd2 .tl,#fd2 .inf{background:#f8fafc}#fd2 .col{background:#fff;border-color:#cbd5e1}#fd2 .tb .d{background:#fff;color:#334155}#fd2 .inf .k{color:#0369a1}#fd2 .chip{background:#e0f2fe;border-color:#7dd3fc}}
@media(prefers-reduced-motion:reduce){#fd2 .stars,#fd2 .spd,#fd2 .fig,#fd2 .holo::after,#fd2 .cf{animation:none!important}}
</style>
<div class='hdr'><div><h1>Do documento à decisão</h1><p>Um agente no Microsoft Foundry percorrendo o processo de ponta a ponta</p></div><div class='ctl'><button type='button' class='b' id='bR' aria-label='Reiniciar'>⟲</button><button type='button' class='b' id='bPv' aria-label='Etapa anterior'>◀</button><button type='button' class='b pri' id='bPl'>❚❚ Pausar</button><button type='button' class='b' id='bN' aria-label='Próxima etapa'>▶</button><a class='b dl' href='./index.html' download='foundry-demo.html' aria-label='Baixar esta página em HTML'>⬇ Baixar</a></div></div>
<div class='vp' id='vp' role='img' aria-label='Animação contínua da jornada do agente'>
<div class='stars'></div><div class='par' id='par'></div>
<div class='cam' id='cam'><div class='world' id='world'><div class='floor'></div><div class='track'><div class='fill' id='fill'></div></div><div id='sts'></div><div class='agent' id='ag'></div></div></div>
<div class='vg'></div><div class='spd'></div><div class='lb t'></div><div class='lb bt'></div>
<div class='l3' id='l3'><small id='l3k'></small><h2 id='l3t'></h2></div>
<div class='rec'><i></i><span id='rec'>CAM 01</span></div>
<div class='dw' id='dw'></div>
</div>
<div class='tl' id='tl'></div>
<div class='inf' id='inf' aria-live='polite'><span class='k' id='ik'></span><h3 id='it'></h3><p class='sum' id='is'></p><div class='cols'><div class='col'><h4>O que acontece</h4><ol id='ia'></ol></div><div class='col'><h4>Componentes</h4><div class='chips' id='ic'></div></div><div class='col'><h4>Dica para apresentar</h4><div class='tip' id='ip'></div></div></div></div>
<script>
(()=>{
const R=document.getElementById('fd2');const q=s=>R.querySelector(s);
const S=[
{n:'Entrada',k:'Entrada multicanal',t:'Uma solicitação entra em cena',sum:'Cliente, fornecedor ou colaborador envia o pedido com anexos. O agente abre um caso e preserva todo o contexto.',act:[['Receber','mensagem, anexos e metadados do canal'],['Classificar','intenção, entidade e urgência'],['Abrir caso','identificador único e histórico inicial']],comp:['Foundry Agent Service','Azure OpenAI','Canal Web / Teams','Microsoft Entra ID'],tip:'Atendimento é a porta de entrada. O valor está no processo que vem depois.',tok:'✉️',c:'#38bdf8'},
{n:'Planejamento',k:'Raciocínio',t:'O agente entende e monta o plano',sum:'O modelo interpreta o objetivo; o agente decompõe a tarefa e escolhe apenas ferramentas autorizadas.',act:[['Interpretar','objetivo, entidades e restrições'],['Planejar','sequência de passos e ferramentas'],['Proteger','identidade, instruções e limites de ação']],comp:['Foundry Agent Service','Azure OpenAI','Instruções do agente','Azure AI Content Safety'],tip:'Diferencie: o modelo raciocina; o agente orquestra estado, ferramentas e execução.',tok:'🧭',c:'#a78bfa'},
{n:'Documentos',k:'Extração',t:'Documentos viram dados estruturados',sum:'PDFs, notas, contratos e formulários são classificados, e campos, tabelas e assinaturas são extraídos.',act:[['Classificar','tipo de cada documento'],['Extrair','campos, tabelas e assinaturas'],['Validar','ausências, divergências e baixa confiança']],comp:['Azure AI Document Intelligence','Azure Blob Storage','Azure Functions','Azure OpenAI'],tip:'Mostre ao vivo um campo ausente sendo sinalizado. Isso gera confiança na plateia.',tok:'📄',c:'#f472b6'},
{n:'Conhecimento',k:'Grounding',t:'O agente encontra as regras certas',sum:'Políticas, manuais e contratos são recuperados com busca híbrida, respeitando permissões e versões.',act:[['Pesquisar','busca híbrida, semântica e vetorial'],['Filtrar','permissões, versão e vigência'],['Citar','evidências anexadas à resposta']],comp:['Azure AI Search','Foundry IQ','SharePoint / Blob','Microsoft Entra ID'],tip:'A IA não responde de memória: responde com evidência corporativa e citação.',tok:'📚',c:'#fbbf24'},
{n:'Ferramentas',k:'Ação em sistemas',t:'Sistemas corporativos entram em ação',sum:'O agente consulta ERP, CRM, crédito e estoque por APIs governadas, sem expor credenciais.',act:[['Consultar','cadastro, status e histórico'],['Cruzar','sistemas, documentos e políticas'],['Preparar','ação proposta, ainda não executada']],comp:['Azure API Management','Azure Functions','Logic Apps','OpenAPI tools','Azure Key Vault'],tip:'API Management é a fachada segura: autenticação, limites de uso e logs.',tok:'🔌',c:'#34d399'},
{n:'Aprovação',k:'Human-in-the-loop',t:'Recomendação com aprovação humana',sum:'O agente apresenta conclusão, confiança e evidências. Uma pessoa aprova, corrige ou rejeita.',act:[['Recomendar','decisão sugerida e justificativa'],['Explicar','evidências e divergências'],['Aprovar','o fluxo pausa até a decisão humana']],comp:['Foundry Agent Service','Logic Apps (aprovação)','Teams / Outlook','App de revisão'],tip:'Momento interativo: peça à plateia para votar em aprovar, corrigir ou rejeitar.',tok:'✅',c:'#22c55e'},
{n:'Resultado',k:'Operação e melhoria',t:'Execução, auditoria e melhoria contínua',sum:'A ação aprovada é executada, tudo é registrado e as interações alimentam avaliações de qualidade e custo.',act:[['Executar','somente a ação aprovada'],['Registrar','trilha de auditoria completa'],['Avaliar','groundedness, latência, custo e resultado']],comp:['Foundry Tracing','Foundry Evaluations','Application Insights','Azure Monitor','Microsoft Purview'],tip:'Feche com o padrão reutilizável para indústria, saúde, finanças, agro e serviços.',tok:'📈',c:'#60a5fa'}];
const DW=5600;R.style.setProperty('--dwell',DW+'ms');
function inner(o){const rb=(o.c||'').indexOf('robot')>-1;return `<div class='fig ${o.c||''}' style='--t:${o.t||'#2563eb'};--l:${o.l||'#1e293b'};--h:${o.h||'#4a2c12'}'><i class='sh'></i><i class='lL'></i><i class='lR'></i><i class='hp'></i><i class='tr'></i><i class='aL'></i><i class='aR'></i><i class='sd'></i><i class='hd'></i>${rb?'':`<i class='hr'></i>`}</div>`}
function fig(o){return `<div class='fw' style='${o.pos};transform:scale(${o.s||1})'>${inner(o)}</div>`}
let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
const bc=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#14b8a6','#e2e8f0'];
function books(hit){let h='';for(let r=0;r<4;r++){h+=`<div class='row'>`;for(let b=0;b<6;b++){const x=hit&&r===1&&b===3;h+=`<span class='${x?'hit':''}' style='height:${55+Math.round(rnd()*40)}%;width:${6+Math.round(rnd()*3)}px;background:${bc[Math.floor(rnd()*bc.length)]}'></span>`}h+='</div>'}return h}
const leds=`<span class='leds'><i></i><i></i><i></i></span>`;
let cf='';for(let i=0;i<16;i++){cf+=`<b class='cf' style='left:${Math.round(rnd()*370)}px;background:${bc[i%bc.length]};animation-delay:${(rnd()*2.6).toFixed(2)}s'></b>`}
let ch='';for(let i=0;i<5;i++){ch+=`<i style='animation-delay:${(.4+i*.3).toFixed(2)}s'>🔗</i>`}
const T=[
`${fig({pos:'left:10px;bottom:0',s:1.25,t:'#f97316',l:'#334155',h:'#3f2a14',c:'give'})}<div class='flydoc'></div><div class='desk' style='right:0;width:150px'></div><div class='holo' style='right:4px;bottom:60px;width:142px'><b>📨 Novo caso #4821</b><div class='seq'><div>Solicitante: Agro Sul</div><div>Anexos: 3 PDFs</div><div><span class='tag'>Prioridade alta</span></div></div></div>`,
`<div class='orbit'><i style='top:-6px;left:54px'></i><i style='bottom:-6px;left:54px;background:#a78bfa;box-shadow:0 0 10px #a78bfa'></i><i style='left:-6px;top:54px;background:#34d399;box-shadow:0 0 10px #34d399'></i></div><div class='orb'></div><div class='holo' style='left:0;bottom:110px;width:128px'><b>🧭 Plano do agente</b><div class='seq'><div>1 · Ler anexos</div><div>2 · Buscar política</div><div>3 · Consultar ERP</div><div>4 · Recomendar</div></div></div><div class='holo' style='right:0;bottom:40px;width:128px'><b>🛡️ Guardrails</b><div class='seq'><div>Identidade do usuário</div><div>Ferramentas permitidas</div><div>Limites de ação</div></div></div>`,
`<div class='scn'><i></i></div><div class='pp'></div><div class='pp' style='animation-delay:.8s'></div><div class='pp' style='animation-delay:1.6s'></div><div class='laser'></div><div class='holo' style='right:0;bottom:70px;width:148px'><b>🧾 Campos extraídos</b><div class='seq'><div>Razão social ✔</div><div>CNPJ ✔</div><div>Valor R$ 48.200 ✔</div><div class='warn'>Assinatura ⚠ ausente</div></div></div>`,
`<div class='shelf' style='left:0'>${books(true)}</div><div class='shelf' style='right:0'>${books(false)}</div><div class='beam'></div><div class='beam lf'></div><div class='holo' style='left:50%;margin-left:-72px;bottom:222px;width:144px'><b>📚 Evidência encontrada</b><div class='seq'><div>Política de Crédito v3 · §4.2</div><div>Relevância 0,94</div></div></div>`,
`<div class='tw' style='left:0;height:130px'>ERP${leds}</div><div class='tw' style='left:66px;height:96px'>CRM${leds}</div><div class='tw' style='right:0;height:136px'>Crédito${leds}</div><div class='tw' style='right:66px;height:100px'>Estoque${leds}</div><div class='cb l'></div><div class='cb r'></div><div class='holo' style='left:50%;margin-left:-72px;bottom:212px;width:144px'><b>🔐 API Management</b><div class='seq'><div>OAuth · Managed Identity</div><div>Rate limit · Logs</div></div></div>`,
`<div class='holo' style='left:0;bottom:80px;width:150px'><b>🤖 Recomendação</b><div>Aprovar com ressalva</div><div class='conf'><i></i></div><div class='seq'><div>Confiança 92%</div><div>3 evidências citadas</div></div></div>${fig({pos:'right:38px;bottom:20px',s:1.2,t:'#0f766e',l:'#1e293b',h:'#111827',c:'rev'})}<div class='desk' style='right:0;width:130px'></div><div class='btnG'>✓</div><div class='stamp'>APROVADO</div>`,
`${fig({pos:'left:0;bottom:0',s:1.1,t:'#db2777',l:'#334155',h:'#78350f',c:'cheer'})}${fig({pos:'left:56px;bottom:0',s:1.1,t:'#f59e0b',l:'#1e3a8a',h:'#111827',c:'cheer'})}<div class='chain'>${ch}</div><div class='holo' style='right:0;bottom:60px;width:150px'><b>📈 Painel da operação</b><div class='bars'><i style='--h:35%'></i><i style='--h:55%;transition-delay:.15s'></i><i style='--h:48%;transition-delay:.3s'></i><i style='--h:78%;transition-delay:.45s'></i><i style='--h:95%;transition-delay:.6s'></i></div><div class='seq'><div>Tempo de ciclo ↓</div><div>Retrabalho ↓ · Automação ↑</div></div></div>${cf}`];
const sts=q('#sts');
S.forEach((s,i)=>{sts.insertAdjacentHTML('beforeend',`<div class='st' style='left:${(i*100/7).toFixed(4)}%;--c:${s.c}'><div class='glow'></div><div class='num'>0${i+1}</div><div class='pad'></div><div class='set'>${T[i]}</div></div>`)});
let ph='';for(let i=0;i<46;i++){const w=30+Math.round(rnd()*50),h=60+Math.round(rnd()*150);ph+=`<div class='bld' style='left:${(i*100/46).toFixed(2)}%;width:${w}px;height:${h}px;opacity:${(.45+rnd()*.5).toFixed(2)}'></div>`}q('#par').innerHTML=ph;
const ag=q('#ag');ag.innerHTML=`<div class='ring'></div><div class='flip'>${inner({c:'robot',t:'#e8eef7',l:'#94a3b8'})}</div><div class='tok' id='tok'></div>`;
const tl=q('#tl');tl.innerHTML=S.map((s,i)=>`<button type='button' class='tb' data-i='${i}' aria-label='Etapa ${i+1}: ${s.n}'><span class='d'>${i+1}</span><span class='lbl'>${s.n}</span></button>`).join('');
const stEls=[...R.querySelectorAll('.st')],tbs=[...R.querySelectorAll('.tb')];
const world=q('#world'),par=q('#par'),cam=q('#cam'),vp=q('#vp'),fill=q('#fill'),l3=q('#l3'),inf=q('#inf'),dw=q('#dw'),tok=q('#tok'),figA=ag.querySelector('.fig'),bPl=q('#bPl');
let cur=-1,playing=true,moving=false,arrT=0,nextT=0,midT=0;
function info(n){const s=S[n];q('#ik').textContent=`ETAPA ${n+1} / ${S.length} · ${s.k.toUpperCase()}`;q('#it').textContent=s.t;q('#is').textContent=s.sum;q('#ia').innerHTML=s.act.map(a=>`<li><b>${a[0]}:</b> ${a[1]}</li>`).join('');q('#ic').innerHTML=s.comp.map(c=>`<span class='chip'>${c}</span>`).join('');q('#ip').textContent=s.tip;tok.textContent=s.tok;inf.classList.remove('fade')}
function go(n){n=(n+S.length)%S.length;if(n===cur)return;clearTimeout(arrT);clearTimeout(nextT);clearTimeout(midT);
const first=cur<0;const d=first?0:Math.abs(n-cur);const dur=first?.05:Math.min(1.4+.35*d,3.4);
R.style.setProperty('--dur',dur+'s');
if(!first){ag.classList.toggle('left',n<cur);figA.classList.add('walk');vp.classList.add('moving');cam.classList.remove('dolly');void cam.offsetWidth;cam.classList.add('dolly');moving=true}
stEls.forEach(e=>e.classList.remove('on'));l3.classList.remove('show');inf.classList.add('fade');dw.classList.remove('run');
world.style.transform=`translateX(${-n*100/7}%)`;par.style.transform=`translateX(${-(n/6)*(200/3)}%)`;
const p=((n+.5)/7*100)+'%';ag.style.left=p;fill.style.width=p;
tbs.forEach((b,i)=>{b.classList.toggle('act',i===n);b.classList.toggle('done',i<n)});
q('#rec').textContent='CAM 0'+(n+1);
cur=n;midT=setTimeout(()=>info(n),dur*500);arrT=setTimeout(arrive,dur*1000)}
function arrive(){moving=false;figA.classList.remove('walk');vp.classList.remove('moving');ag.classList.remove('left');const s=S[cur];stEls[cur].classList.add('on');q('#l3k').textContent=`Etapa ${cur+1} de ${S.length} · ${s.k}`;q('#l3t').textContent=s.t;l3.classList.add('show');if(playing)sched()}
function sched(){clearTimeout(nextT);dw.classList.remove('run');void dw.offsetWidth;dw.classList.add('run');nextT=setTimeout(()=>go(cur+1),DW)}
bPl.addEventListener('click',()=>{playing=!playing;bPl.textContent=playing?'❚❚ Pausar':'▶ Reproduzir';if(playing){if(!moving)sched()}else{clearTimeout(nextT);dw.classList.remove('run')}});
q('#bN').addEventListener('click',()=>go(cur+1));q('#bPv').addEventListener('click',()=>go(cur-1));q('#bR').addEventListener('click',()=>go(0));
tl.addEventListener('click',e=>{const b=e.target.closest('.tb');if(b)go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}else if(e.key===' '){e.preventDefault();bPl.click()}});
go(0);
})();
</script>
